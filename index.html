<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Kenanga 6</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2e7d32; font-size: 1.5rem; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .product-card { background: #fafafa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; text-align: center; }
        .product-card h3 { margin: 5px 0; font-size: 1rem; }
        .price { color: #d32f2f; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }
        button { background-color: #388e3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        button:hover { background-color: #2e7d32; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f1f1f1; }
        .total { font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
        .payment-section { margin-top: 15px; }
        .payment-section select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; margin-top: 5px; font-size: 1rem; }
        .wa-btn { background-color: #25d366; width: 100%; padding: 12px; margin-top: 15px; font-size: 1rem; font-weight: bold; border-radius: 6px; }
        .wa-btn:hover { background-color: #1ebe5d; }
        .clear-btn { background-color: #d32f2f; width: 100%; padding: 8px; margin-top: 8px; }
        .clear-btn:hover { background-color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏪 Warung Kenanga 6</h1>
        
        <div class="product-grid" id="product-list"></div>

        <h3>Keranjang Belanja</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Jml</th>
                    <th>Harga</th>
                </tr>
            </thead>
            <tbody id="cart-table-body">
                <tr><td colspan="3" style="text-align: center;">Keranjang kosong</td></tr>
            </tbody>
        </table>

        <div class="total" id="total-text">TOTAL BAYAR: Rp 0</div>

        <div class="payment-section">
            <label for="payment-method"><b>Metode Pembayaran:</b></label>
            <select id="payment-method">
                <option value="Cash (Bayar di Tempat)">Cash (Bayar di Tempat)</option>
                <option value="Transfer Bank">Transfer Bank</option>
                <option value="QRIS">QRIS</option>
            </select>
        </div>

        <button class="wa-btn" onclick="checkoutWhatsApp()">📩 Kirim ke WhatsApp</button>
        <button class="clear-btn" onclick="clearCart()">Kosongkan Keranjang</button>
    </div>

    <script>
        const products = [
            { id: 1, name: "Kopi Hitam", price: 4000 },
            { id: 2, name: "Gorengan", price: 1500 },
            { id: 3, name: "Beras (1 Kg)", price: 15000 },
            { id: 4, name: "Minyak Goreng", price: 18000 },
            { id: 5, name: "Gula Pasir", price: 16000 },
            { id: 6, name: "Sabun Mandi", price: 4500 }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <h3>${p.name}</h3>
                    <div class="price">Rp ${p.price.toLocaleString('id-ID')}</div>
                    <button onclick="addToCart(${p.id})">Tambah</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cart-table-body');
            const totalText = document.getElementById('total-text');
            
            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Keranjang kosong</td></tr>`;
                totalText.innerText = "TOTAL BAYAR: Rp 0";
                return;
            }

            let total = 0;
            tbody.innerHTML = cart.map(item => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                return `<tr><td>${item.name}</td><td>${item.qty}x</td><td>Rp ${subtotal.toLocaleString('id-ID')}</td></tr>`;
            }).join('');

            totalText.innerText = `TOTAL BAYAR: Rp ${total.toLocaleString('id-ID')}`;
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("Keranjang belanja masih kosong!");
                return;
            }

            const paymentMethod = document.getElementById('payment-method').value;
            let message = "🛒 *PESANAN BARU - WARUNG KENANGA 6*\n\n";
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                message += `• ${item.name} (${item.qty}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
            });

            message += `\n💰 *TOTAL BAYAR: Rp ${total.toLocaleString('id-ID')}*`;
            message += `\n📌 *Metode Pembayaran: ${paymentMethod}*`;
            message += `\n\nMohon segera diproses ya, terima kasih!`;

            const phone = "6287784542093";
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
