<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">
    <!-- Header Modern & Elegan -->
    <header class="bg-gradient-to-r from-emerald-700 via-emerald-600 to-teal-700 text-white px-5 py-5 shadow-lg sticky top-0 z-50 rounded-b-2xl">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight flex items-center gap-2">
                        <span>Warung Digital</span>
                    </h1>
                    <p class="text-xs text-emerald-100 font-medium tracking-wide mt-0.5">Belanja Praktis dan Terima Pesan Antar</p>
                </div>
                <!-- Tombol Keranjang -->
                <button onclick="toggleCartModal()" class="relative bg-white/10 hover:bg-white/20 border border-white/20 p-2.5 rounded-2xl backdrop-blur-md transition shadow-sm flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H19m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-emerald-700 shadow-sm hidden">0</span>
                </button>
            </div>

            <!-- Kartu Info Jadwal Pengiriman -->
            <div class="bg-black/15 backdrop-blur-sm border border-white/15 rounded-xl px-3 py-2 flex items-center gap-2.5 text-xs text-emerald-50 shadow-inner">
                <span class="flex h-2 w-2 relative flex-shrink-0">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-300"></span>
                </span>
                <span class="font-medium tracking-wide">🕒 Pengiriman 18.30 - 20.30 Setiap Hari (Tanpa Minimal Belanja)</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        <!-- Kategori Produk -->
        <section class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
            <h2 class="font-semibold text-sm text-gray-700 mb-2">Kategori</h2>
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterCategory('semua')" class="cat-btn bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition">Semua</button>
                <button onclick="filterCategory('Makanan')" class="cat-btn bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition hover:bg-gray-200">Makanan</button>
                <button onclick="filterCategory('Minuman')" class="cat-btn bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition hover:bg-gray-200">Minuman</button>
                <button onclick="filterCategory('Sayuran')" class="cat-btn bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition hover:bg-gray-200">Sayuran</button>
                <button onclick="filterCategory('Buah-buahan')" class="cat-btn bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition hover:bg-gray-200">Buah-buahan</button>
                <button onclick="filterCategory('Bumbu')" class="cat-btn bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-medium whitespace-nowrap transition hover:bg-gray-200">Bumbu</button>
            </div>
        </section>

        <!-- Daftar Produk -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 id="category-title" class="font-semibold text-base text-gray-700 mb-3">Semua Produk</h2>
            <div id="product-list" class="space-y-3"></div>
        </section>
    </main>

    <!-- Modal / Popup Keranjang Belanja -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h2 class="font-bold text-base text-gray-800">Keranjang Belanja</h2>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 text-sm font-bold p-1">✕</button>
            </div>

            <div id="cart-list" class="divide-y divide-gray-100 overflow-y-auto flex-1 mb-3 text-sm max-h-48">
                <p class="text-gray-400 py-4 text-center">Keranjang masih kosong</p>
            </div>

            <div class="border-t pt-3 space-y-3">
                <div class="flex justify-between font-bold text-base">
                    <span>Total:</span>
                    <span id="cart-total" class="text-emerald-600">Rp 0</span>
                </div>

                <!-- Pilihan Metode Pembayaran -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Metode Pembayaran:</label>
                    <div class="grid grid-cols-1 gap-2 text-xs">
                        <label class="border rounded-lg p-2.5 flex items-center gap-2 cursor-pointer hover:border-emerald-500 transition">
                            <input type="radio" name="payment" value="COD (Bayar di Tempat)" checked class="text-emerald-600 focus:ring-emerald-500">
                            <span class="font-medium text-gray-700">COD (Bayar di Tempat)</span>
                        </label>
                        <label class="border rounded-lg p-2.5 flex items-start gap-2 cursor-pointer hover:border-emerald-500 transition">
                            <input type="radio" name="payment" value="Transfer Bank BCA 0020086335 a.n Didin" class="text-emerald-600 focus:ring-emerald-500 mt-0.5">
                            <div>
                                <span class="font-medium text-gray-700 block">Transfer Bank BCA</span>
                                <span class="text-[11px] text-gray-500">No. Rek: 0020086335 (a.n. Didin)</span>
                            </div>
                        </label>
                    </div>
                </div>
                
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-medium transition text-sm shadow-sm flex items-center justify-center gap-2">
                    <span>Pesan via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js?v=13"></script>
</body>
</html>
